<style>
  html { -webkit-text-size-adjust: 100%; }
  body { background-image: radial-gradient(rgba(140,120,90,.16) 1px, transparent 1.2px); background-size: 18px 18px; font-family: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  .font-jua { font-family: "Jua", "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  .chalk-text { text-shadow: 0 0 1px rgba(255,255,255,.6); letter-spacing: .02em; }
  .board-surface { background: radial-gradient(ellipse at 30% 20%, #3E5F4E 0%, #344F42 55%, #2C4438 100%); }
  .tech-card { transition: transform .18s ease; }
  .tech-card:hover { transform: translateY(-3px); }
  #player { transition: left .15s linear, top .15s linear; }
  .friend { transition: left .2s linear, top .2s linear; }
  #map { background-color:#EFE4D0; background-image: linear-gradient(rgba(140,115,80,.10) 1px, transparent 1px), linear-gradient(90deg, rgba(140,115,80,.10) 1px, transparent 1px); background-size: calc(100%/20) calc(100%/17); outline: none; }
  .dbtn { width: 48px; height: 44px; border-radius: 14px; background: #E3ECE4; color: #3B5E4A; font-size: 18px; font-weight: 700; border: 2px solid #3B5E4A; touch-action: none; user-select: none; -webkit-user-select: none; }
  .dbtn:active { background: #3B5E4A; color: #fff; }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
  @keyframes pop { 0% { transform: scale(.96); } 40% { transform: scale(1.025); } 100% { transform: scale(1); } }
  .pop { animation: pop .55s ease; }
  @keyframes wiggle { 0%,100% { transform: rotate(0) } 25% { transform: rotate(-4deg) } 75% { transform: rotate(4deg) } }
  .wiggle { animation: wiggle .35s ease 2; }
  @keyframes floaty { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  .floaty { animation: floaty 2.4s ease-in-out infinite; }
  @keyframes glow { 0%,100% { box-shadow: 0 0 0 0 rgba(59,94,74,.40) } 50% { box-shadow: 0 0 0 10px rgba(59,94,74,0) } }
  .glow { animation: glow 1.8s ease-in-out infinite; }
  .lock-veil { background: rgba(255,250,242,.82); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  #sketch { touch-action: none; }
  .modal-enter { animation: pop .3s ease; }
  @media print {
    @page { size: A4 portrait; margin: 12mm; }
    body { background: #fff !important; }
    body * { visibility: hidden !important; }
    #finalCard, #finalCard * { visibility: visible !important; }
    #finalCard { position: absolute; left: 0; top: 0; width: 100% !important; max-width: none !important; box-shadow: none !important; }
    #finalCard * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>

<body class="bg-cream text-ink min-h-screen">

<!-- ===================== 상단 바 ===================== -->
<header class="sticky top-0 z-30 bg-paper border-b-2 border-line shadow-sm">
  <div class="max-w-6xl mx-auto px-3 sm:px-5 py-2.5 flex flex-wrap items-center gap-2 sm:gap-3">
    <div class="flex items-center gap-2 mr-auto">
      <span class="text-2xl sm:text-3xl">🏫</span>
      <div>
        <h1 class="font-jua text-lg sm:text-2xl leading-none text-lavd">우리 반 발명 교실</h1>
        <div id="sessionChip" class="text-[11px] sm:text-xs text-inksoft mt-0.5"></div>
      </div>
    </div>
    <div id="progressChips" class="flex items-center gap-1 sm:gap-1.5 text-xs sm:text-sm"></div>
    <button id="teacherToggle" class="font-jua text-sm sm:text-base px-3 py-2 rounded-full bg-lemon text-ink border-2 border-lemond hover:brightness-95 active:scale-95 transition">
      👑 교사 컨트롤러 <span id="teacherToggleArrow">▾</span>
    </button>
  </div>
</header>

<!-- ===================== 교사 컨트롤러 ===================== -->
<section id="teacherPanel" class="hidden bg-lemon border-b-2 border-lemond">
  <div class="max-w-6xl mx-auto px-3 sm:px-5 py-4" id="teacherBody"></div>
</section>

<!-- 연결 끊김 안내 -->
<div id="offlineBar" class="hidden bg-peach border-b-2 border-peachd text-center text-sm sm:text-base font-jua px-3 py-2">
  🟠 인터넷 연결이 끊겼어요 · 다시 연결하는 중… 내가 쓴 내용은 이 기기에 저장되고, 연결되면 자동으로 보내져요
</div>

<main class="max-w-6xl mx-auto px-3 sm:px-5 py-4 sm:py-6 space-y-5">

  <!-- ===================== 선생님 안내 배너 ===================== -->
  <section id="banner" class="rounded-3xl border-4 border-lavd bg-lav p-4 sm:p-5 flex gap-3 sm:gap-4 items-start shadow-md">
    <div class="text-4xl sm:text-5xl floaty select-none">📢</div>
    <div class="flex-1 min-w-0">
      <div class="flex flex-wrap items-center gap-2 mb-1.5">
        <span id="bannerStage" class="font-jua text-sm sm:text-base px-3 py-1 rounded-full bg-lavd text-white"></span>
        <span class="text-xs sm:text-sm text-lavd font-bold">선생님 안내</span>
      </div>
      <p id="bannerText" class="font-jua text-lg sm:text-2xl leading-snug break-keep"></p>
    </div>
  </section>

  <!-- ===================== 교실 맵 ===================== -->
  <section class="rounded-[28px] border-[6px] border-woodd shadow-xl overflow-hidden bg-paper">
    <div id="map" class="relative w-full select-none touch-manipulation" style="aspect-ratio:20/17;" tabindex="0" aria-label="교실 맵: 바닥이나 물건을 눌러 이동해요">
      <div id="mapLayer" class="absolute inset-0"></div>
      <div id="friendsLayer" class="absolute inset-0 pointer-events-none"></div>
      <div id="player" class="absolute z-30 pointer-events-none flex flex-col items-center justify-end">
        <div id="pBubble" role="button" class="hidden absolute bottom-[118%] left-1/2 -translate-x-1/2 whitespace-nowrap font-jua rounded-full bg-ink text-white shadow-lg pointer-events-auto cursor-pointer" style="font-size:calc(var(--t)*.36);padding:calc(var(--t)*.12) calc(var(--t)*.3);"></div>
        <div id="pEmoji" class="leading-none drop-shadow" style="font-size:calc(var(--t)*.95)">🧑‍🎓</div>
        <div id="pName" class="font-jua bg-ink text-white rounded-full whitespace-nowrap -mt-[2px]" style="font-size:calc(var(--t)*.28);padding:0 calc(var(--t)*.15);">나</div>
      </div>
    </div>
    <div id="controlBar" class="bg-paper border-t-4 border-woodd px-4 py-3 text-sm sm:text-base text-inksoft break-keep leading-relaxed">
      👆 <b class="text-ink">바닥</b>을 누르면 그곳으로 걸어가요 · <b class="text-ink">내 자리·칠판·물건·친구 자리</b>를 누르면 걸어가서 바로 열려요
    </div>
    <div id="teacherMapNote" class="hidden bg-paper border-t-4 border-woodd px-4 py-3 text-sm text-inksoft break-keep">
      👑 선생님 화면이에요 · 학생 자리를 누르면 그 학생의 노트·카드를 볼 수 있어요. 학생들의 움직임이 실시간으로 보여요.
    </div>
  </section>

  <div id="bookmarkTray" class="rounded-2xl bg-paper border-2 border-dashed border-woodd px-3 py-2.5 flex flex-wrap items-center gap-2 text-sm"></div>

  <section id="resultSection" class="hidden"></section>

  <footer class="text-center text-xs text-inksoft pb-6">
    🔒 잠긴 공간은 선생님이 단계를 열어 주면 들어갈 수 있어요 · 내가 쓴 내용은 이 기기에도 자동 저장돼요
  </footer>
</main>

<!-- ===================== 입장 화면 ===================== -->
<div id="entry" class="hidden fixed inset-0 z-[70] bg-cream overflow-y-auto">
  <div class="max-w-3xl mx-auto px-4 py-8 sm:py-12" id="entryBody"></div>
</div>

<!-- ===================== 모달 & 토스트 ===================== -->
<div id="modal" class="fixed inset-0 z-[75] hidden items-end sm:items-center justify-center p-0 sm:p-4" style="background:rgba(47,58,51,.45)">
  <div id="modalBox" class="bg-paper w-full sm:max-w-2xl max-h-[92vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl shadow-2xl border-4 border-line"></div>
</div>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-6 z-[80] hidden font-jua text-base sm:text-lg px-5 py-3 rounded-full bg-ink text-white shadow-xl text-center max-w-[92vw]"></div>

const K = { session:'inventClass.v2.session', pin:'inventClass.v1.pin', panel:'inventClass.v1.panelOpen', auth:'inventClass.v1.teacherAuth', soloStage:'inventClass.v1.stage', soloQ:'inventClass.v1.questions' };
const store = {
  get(k, fb){ try { const v = localStorage.getItem(k); return v === null ? fb : JSON.parse(v); } catch(e){ return fb; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ toast('⚠️ 저장 공간이 부족해요. 그림을 지우고 다시 해 보세요.'); } },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl2br = s => esc(s).replace(/\n/g, '<br>');
const clampStage = n => { n = parseInt(n, 10); return [1,2,3].includes(n) ? n : 1; };
const hashPin = s => { let h1 = 0xdeadbeef ^ 7, h2 = 0x41c6ce57 ^ 7; for (let i = 0; i < s.length; i++){ const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36); };

const defaultData = () => ({ num:0, name:'', group:'', avatar:'🧑‍🎓', problems:['',''], registered:false, bookmarks:[],
  card:{ pIdx:0, title:'', idea:'', sketch:'', done:false, doneAt:'' }, updatedAt:0 });
function normData(d){
  const x = Object.assign(defaultData(), d || {});
  x.card = Object.assign(defaultData().card, x.card || {});
  x.problems = Array.isArray(x.problems) ? [x.problems[0] || '', x.problems[1] || ''] : ['',''];
  x.bookmarks = Array.isArray(x.bookmarks) ? x.bookmarks.filter(id => techById(id)).slice(0, 2) : [];
  return x;
}

let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); t.classList.remove('pop'); void t.offsetWidth; t.classList.add('pop');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hidden'), 2800);
}
let onModalClose = null, modalName = '';
function openModal(html, closeCb, name){
  const m = $('#modal'), b = $('#modalBox');
  b.innerHTML = html; b.classList.remove('modal-enter'); void b.offsetWidth; b.classList.add('modal-enter');
  m.classList.remove('hidden'); m.classList.add('flex'); b.scrollTop = 0;
  onModalClose = closeCb || null; modalName = name || '';
}
function closeModal(){
  const m = $('#modal'); m.classList.add('hidden'); m.classList.remove('flex');
  const cb = onModalClose; onModalClose = null; modalName = ''; if (cb) cb();
}
const modalOpen = () => !$('#modal').classList.contains('hidden');
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalOpen()) closeModal(); });

/* =========================================================
   🌐 서버 연결 (Firebase Realtime Database)
   ========================================================= */
const configReady = () => !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL);
function makeFirebaseAdapter(cfg){
  const app = firebase.apps && firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg);
  const db = app.database();
  return {
    on(path, cb){ const r = db.ref(path); const h = r.on('value', s => cb(s.val()), () => {}); return () => r.off('value', h); },
    set: (path, v) => db.ref(path).set(v),
    update: (path, v) => db.ref(path).update(v),
    remove: path => db.ref(path).remove(),
    get: path => db.ref(path).get().then(s => s.val()),
    onDisconnectRemove: path => db.ref(path).onDisconnect().remove(),
    cancelOnDisconnect: path => db.ref(path).onDisconnect().cancel(),
    onConnected(cb){ const r = db.ref('.info/connected'); const h = r.on('value', s => cb(!!s.val())); return () => r.off('value', h); }
  };
}
function getAdapter(){
  if (window.__SYNC_FACTORY__) return window.__SYNC_FACTORY__();       // 테스트용
  if (!configReady() || !window.firebase || !firebase.initializeApp) return null;
  try { return makeFirebaseAdapter(FIREBASE_CONFIG); } catch(e){ console.warn(e); return null; }
}
const withTimeout = (p, ms) => Promise.race([Promise.resolve(p).catch(() => undefined), new Promise(r => setTimeout(() => r(undefined), ms))]);
const classAvailable = () => !!(window.__SYNC_FACTORY__ || (configReady() && window.firebase));

const Net = {
  api: null, offs: [], pushTimer: null, posTimer: null, lastSketch: null, lastPos: '',
  p(path){ return `rooms/${SESSION.room}/${path}`; },
  ensure(){ if (!this.api){ this.api = getAdapter(); if (this.api) this.api.onConnected(c => { this.connected = c; }); } return this.api; },
  waitOnline(ms){
    if (!this.ensure()) return Promise.resolve(false);
    if (this.connected) return Promise.resolve(true);
    return new Promise(res => { let done = false, off = null;
      const fin = v => { if (done) return; done = true; if (off) setTimeout(off, 0); res(v); };
      off = this.api.onConnected(c => { if (c) fin(true); }); setTimeout(() => fin(false), ms); });
  },
  start(){
    if (!this.ensure()) return false;
    this.stop(); this.startedAt = Date.now(); setTimeout(renderConn, 3200);
    const a = this.api;
    this.offs.push(a.onConnected(c => {
      ROOM.online = c; renderConn();
      if (c && SESSION.role === 'student'){
        a.onDisconnectRemove(this.p(`presence/${SESSION.num}`));
        this.lastPos = ''; this.pushPos(true);
        // 다시 연결되면: 이 기기 기록이 서버보다 새것일 때만 올리기 (오래된 기기가 덮어쓰지 않게)
        if (D.updatedAt) withTimeout(a.get(this.p(`students/${SESSION.num}`)), 5000).then(srv => {
          if (srv === undefined) return;
          if (!srv || (srv.updatedAt || 0) < D.updatedAt){ this.pushMine(true); this.pushSketch(true); }
        });
      }
    }));
    this.offs.push(a.on(this.p('stage'), v => { if (v != null) setStage(v, { remote:true }); }));
    this.offs.push(a.on(this.p('questions'), v => { Q = Object.assign({}, DEFAULT_Q, v || {}); renderBanner(); if (panelOpen) renderTeacher(); }));
    this.offs.push(a.on(this.p('pinHash'), v => { ROOM.pinHash = v || null; }));
    this.offs.push(a.on(this.p('showFriends'), v => { ROOM.showFriends = v !== false; renderFriends(); if (isTeacherView() && panelOpen) renderTeacher(); }));
    this.offs.push(a.on(this.p('students'), v => {
      const s = {}; Object.entries(v || {}).forEach(([k, d]) => { if (d) s[k] = normData(d); });
      ROOM.students = s; onRoomData();
    }));
    this.offs.push(a.on(this.p('presence'), v => { ROOM.presence = v || {}; renderFriends(); renderConn(); if (modalName === 'dash') openDashboard(); }));
    return true;
  },
  stop(){ this.offs.forEach(f => { try { f(); } catch(e){} }); this.offs = []; clearTimeout(this.pushTimer); clearTimeout(this.posTimer); },
  light(){ const c = Object.assign({}, D.card); const has = !!c.sketch; delete c.sketch; c.hasSketch = has;
    return { num:SESSION.num, name:D.name, group:D.group, avatar:D.avatar, problems:D.problems, registered:D.registered, bookmarks:D.bookmarks, card:c, updatedAt:D.updatedAt || Date.now() }; },
  pushMine(now){
    if (!isClass() || SESSION.role !== 'student' || !this.api) return;
    clearTimeout(this.pushTimer);
    const go = () => { this.api.set(this.p(`students/${SESSION.num}`), this.light()).catch(() => {}); this.pushSketch(); };
    if (now) go(); else this.pushTimer = setTimeout(go, 700);
  },
  pushSketch(force){
    if (!this.api || !isClass() || SESSION.role !== 'student') return;
    const s = D.card.sketch || '';
    if (!force && s === this.lastSketch) return;
    this.lastSketch = s;
    (s ? this.api.set(this.p(`sketches/${SESSION.num}`), s) : this.api.remove(this.p(`sketches/${SESSION.num}`))).catch(() => {});
  },
  pushPos(force){
    if (!this.api || !isClass() || SESSION.role !== 'student') return;
    const key = `${P.x},${P.y},${P.dir},${D.avatar},${D.name}`;
    if (!force && key === this.lastPos) return;
    clearTimeout(this.posTimer);
    this.posTimer = setTimeout(() => {
      this.lastPos = key;
      this.api.set(this.p(`presence/${SESSION.num}`), { x:P.x, y:P.y, dir:P.dir, avatar:D.avatar, name:D.name || SESSION.name, t:Date.now() }).catch(() => {});
    }, force ? 0 : 110);
  },
  leave(){ if (this.api && isClass() && SESSION.role === 'student'){ this.api.remove(this.p(`presence/${SESSION.num}`)).catch(() => {}); } this.stop(); },
  getSketch: num => Net.api ? withTimeout(Net.api.get(Net.p(`sketches/${num}`)), 6000) : Promise.resolve(undefined)
};

/* 서버에서 반 데이터가 바뀌었을 때 */
let seatSig = '';
function onRoomData(){
  const sig = Object.values(ROOM.students).map(s => [s.num, s.name, s.avatar, s.registered, s.card.done].join('|')).sort().join('/');
  if (sig !== seatSig){ seatSig = sig; renderMap(); }
  if (modalName === 'dash') openDashboard();
  if (modalName === 'gallery') openGallery();
  // 다른 기기에서 쓴 내 기록이 더 최신이면 가져오기 (기기 바꿔 접속했을 때)
  if (isClass() && SESSION.role === 'student'){
    const mine = ROOM.students[SESSION.num];
    if (mine && (mine.updatedAt || 0) > (D.updatedAt || 0) + 1000 && !modalOpen()){
      const sk = D.card.sketch; D = normData(mine); D.card.sketch = sk;
      store.set(dataKey(), D); renderAll();
      if (mine.card.hasSketch) Net.getSketch(SESSION.num).then(s => { if (s){ D.card.sketch = s; Net.lastSketch = s; store.set(dataKey(), D); renderResult(); } });
    }
  }
}

    </details>`;
  $('#entry').classList.remove('hidden');
  $('#soloBtn').onclick = () => startSession({ mode:'solo' });
  if (!avail) return;
  const validRoom = r => /^[가-힣A-Za-z0-9_-]{2,20}$/.test(r);
  $('#joinForm').onsubmit = async e => {
    e.preventDefault();

    if (!validRoom(room)){ toast('🏷️ 반 코드를 확인해 주세요 (한글·영문·숫자 2~20자)'); f.room.focus(); return; }
    if (!name){ toast('🙋 이름을 적어 주세요'); f.name.focus(); return; }
    const btn = f.querySelector('button'); btn.disabled = true; btn.textContent = '확인하는 중…';
    const a = Net.ensure();
    const online = await Net.waitOnline(5000);
    const [pres, stu, exists] = a && online ? await Promise.all([
      withTimeout(a.get(`rooms/${room}/presence/${num}`), 4000),
      withTimeout(a.get(`rooms/${room}/students/${num}`), 4000),
      withTimeout(a.get(`rooms/${room}/pinHash`), 4000)
    ]) : [];
    btn.disabled = false; btn.textContent = '교실 입장하기';
    const go = () => startSession({ mode:'class', role:'student', room, num, name });
    if (exists === null){ toast('🤔 그런 반 코드가 없어요. 선생님께 다시 확인해요'); return; }
    if (exists === undefined) toast('🟠 인터넷이 불안정해요. 일단 입장하고, 연결되면 자동으로 이어져요');
    if (pres && Date.now() - (pres.t || 0) < 10 * 60 * 1000){ confirmBox(`지금 <b>${num}번 ${esc(pres.name || '')}</b> 학생이 접속해 있어요. 내 번호가 정말 ${num}번인가요?`, '네, 제 번호예요', go, '번호 다시 고르기'); return; }
    if (stu && stu.name && stu.name !== name){ confirmBox(`${num}번 자리에 <b>${esc(stu.name)}</b> 학생의 기록이 있어요. 내 번호가 정말 ${num}번인가요?`, '네, 제 번호예요', go, '번호 다시 고르기'); return; }

    e.preventDefault();
    const f = e.target, room = f.room.value.trim(), pin = f.pin.value.trim();
    if (!validRoom(room)){ toast('🏷️ 반 코드를 확인해 주세요'); return; }
    if (pin.length < 4){ toast('🔐 비밀번호는 4자리 이상이에요'); return; }
    const a = Net.ensure();
    const btn = f.querySelector('button'); btn.disabled = true; btn.textContent = '연결 중…';
    const online = await Net.waitOnline(6000);
    const ph = a && online ? await withTimeout(a.get(`rooms/${room}/pinHash`), 5000) : undefined;
    btn.disabled = false; btn.textContent = '입장';
    if (ph === undefined){ toast('🟠 인터넷에 연결되어야 선생님으로 입장할 수 있어요'); return; }

      confirmBox(`<b>「${esc(room)}」</b> 반을 새로 만들까요? 방금 입력한 비밀번호가 이 반의 교사 비밀번호가 돼요.`, '새 반 만들기', async () => {
        await a.update(`rooms/${room}`, { pinHash: hashPin(pin), stage: 1, createdAt: Date.now() }).catch(() => {});
        startSession({ mode:'class', role:'teacher', room, num:0, name:'선생님' });
      });
      return;
    }
    if (ph !== hashPin(pin)){ toast('🙅 이 반의 교사 비밀번호가 아니에요'); return; }
    startSession({ mode:'class', role:'teacher', room, num:0, name:'선생님' });
  };
}
function startSession(s){
  if (isClass()) Net.leave();
  SESSION = s; store.set(K.session, s);
  if (s.mode === 'class') store.set('inventClass.v2.lastRoom', s.room);
  $('#entry').classList.add('hidden');
  ROOM = { students:{}, presence:{}, online:false, pinHash:null, showFriends:true }; seatSig = '';
  loadLocal();
  P.x = START.x; P.y = START.y;
  if (isTeacherView()){ teacherAuthed = true; panelOpen = true; }
  if (isClass() && !Net.start()){ toast('⚠️ 서버에 연결할 수 없어 혼자 하기로 시작해요'); SESSION = { mode:'solo' }; store.set(K.session, SESSION); loadLocal(); }
  renderAll();
  if (!isTeacherView()) setTimeout(() => toast('👆 내 자리를 눌러 보세요! 걸어가서 문제 노트가 열려요'), 500);
}
function leaveSession(){
  confirmBox('처음 화면으로 나갈까요? 지금까지 쓴 내용은 이 기기에 그대로 남아 있어요.', '나가기', () => {
    if (isClass()) Net.leave();
    SESSION = null; store.del(K.session); sessionStorage.removeItem(K.auth); teacherAuthed = false; panelOpen = false; showEntry();
  });
}

function setStage(n, opts = {}){
  n = clampStage(n);
  const prev = stage; stage = n;
  store.set(stageKey(), n);
  if (!opts.remote && isTeacherView() && Net.api){
    Net.api.set(Net.p('stage'), n).catch(() => {});
    if (!ROOM.online) toast('🟠 연결이 끊겨 있어요. 다시 연결되면 학생들에게 자동으로 전달돼요');
  }
  renderAll();
  if (n === prev) return;
  const b = $('#banner'); b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  if (n > prev) toast(`🔓 ${n}단계가 열렸어요!`);
  else toast(`↩️ ${n}단계로 돌아왔어요`);
}

/* =========================================================
   🗺️ 교실 맵 (20칸 × 17칸, 자리 24개)
   ========================================================= */
const COLS = 20, ROWS = 17;
const START = { x: 7, y: 15 };
const SEAT_X = [2,4,6,8,10,12], SEAT_Y = [7,9,11,13];
const seatPos = n => ({ x: SEAT_X[(n-1) % 6], y: SEAT_Y[Math.floor((n-1) / 6)] });
const myNum = () => isTeacherView() ? 0 : isClass() ? SESSION.num : (D.num || 1);
const P = Object.assign({ x: START.x, y: START.y, dir: 'down' }, (() => { try { return JSON.parse(sessionStorage.getItem('inventClass.v2.pos')) || {}; } catch(e){ return {}; } })());
const keyOf = (x, y) => x + ',' + y;
const pct = (v, n) => (v * 100 / n) + '%';
function box(x, y, w, h, cls = '', inner = '', style = '', attrs = ''){
  return `<div ${attrs} class="absolute ${cls}" style="left:${pct(x,COLS)};top:${pct(y,ROWS)};width:${pct(w,COLS)};height:${pct(h,ROWS)};${style}">${inner}</div>`;
}
const fs = k => `font-size:calc(var(--t)*${k});`;
const seatInfo = n => n === myNum() ? D : (isClass() ? ROOM.students[n] : null);

function blockedSet(){
  const B = new Set(), add = (x, y) => B.add(keyOf(x, y));
  for (let x = 0; x < COLS; x++){ for (let y = 0; y <= 2; y++) add(x, y); add(x, ROWS - 1); }
  for (let y = 0; y < ROWS; y++){ add(0, y); add(COLS - 1, y); }
  if (stage < 2) for (let x = 3; x <= 16; x++) add(x, 3);                         // 칠판 앞 잠금 줄
  add(9, 5); add(10, 5);                                                           // 교탁
  for (let x = 15; x <= 18; x++) add(x, 4);                                        // 작품 게시판
  add(1, 4); add(1, 13); add(1, 14);                                               // 화분, 책장
  for (let n = 1; n <= MAX_SEATS; n++){ const s = seatPos(n); add(s.x, s.y); }   // 책상
  for (let y = 6; y <= 15; y++) if (y !== 10 || stage < 3) add(14, y);            // 작업대 울타리 + 문
  for (let x = 14; x <= 18; x++) add(x, 6);
  [[16,10],[17,10],[16,11],[17,11]].forEach(([x, y]) => add(x, y));               // 작업대
  return B;
}
let BLOCK = new Set();

function interactables(){
  const L = [];
  if (stage >= 2) TECH.forEach((t, i) => L.push({ key:'tech:' + t.id, triggers:[[4+2*i,3],[5+2*i,3]], label:`${t.icon} ${t.name} 카드 보기`, act:() => openTech(t.id) }));
  else L.push({ key:'gate:2', triggers:Array.from({length:14}, (_, k) => [3+k, 4]), label:'🔒 칠판은 2단계에 열려요', act:() => openLocked(2) });
  const me = myNum();
  if (me){ const s = seatPos(me); L.push({ key:'desk', triggers:[[s.x, s.y + 1]], label: D.registered ? '📒 내 문제 노트 보기' : '📝 내 책상 · 문제 노트 쓰기', act:openDesk }); }
  if (isClass()) Object.values(ROOM.students).forEach(st => {
    if (!st.num || st.num === me || st.num > MAX_SEATS) return;
    const s = seatPos(st.num);
    L.push({ key:'seat:' + st.num, triggers:[[s.x, s.y + 1]], label:`👀 ${st.num}번 ${st.name}의 노트 보기`, act:() => openFriend(st.num) });
  });
  L.push({ key:'podium', triggers:[[8,5],[11,5],[9,6],[10,6]], label:'📢 교탁 · 선생님 안내 크게 보기', act:openQuestion });
  L.push({ key:'gallery', triggers:[[15,5],[16,5],[17,5],[18,5]], label:'🖼️ 작품 게시판 보기', act:openGallery });
  if (stage >= 3) L.push({ key:'bench', triggers:[[15,10],[15,11],[18,10],[18,11],[16,9],[17,9],[16,12],[17,12]], label:'🛠️ 발명 작업대 · 아이디어 구상', act:openBench });
  else L.push({ key:'gate:3', triggers:[[13,10]], label:'🔒 작업대는 3단계에 열려요', act:() => openLocked(3) });
  return L;
}
function currentInteract(){
  if (isTeacherView()) return null;
  return interactables().find(it => it.triggers.some(([x, y]) => x === P.x && y === P.y)) || null;
}

    h += box(3, 3, 14, 1, 'flex items-center justify-center font-jua cursor-pointer', `🚧 2단계에 열려요 🚧`, 'background:repeating-linear-gradient(45deg,#EBD9A8 0 12px,#F6EBCB 12px 24px);border-top:2px solid #A8822E;border-bottom:2px solid #A8822E;color:#7A6125;' + fs(.34), 'data-obj="gate:2"');

  h += box(9, 5, 2, 1, 'rounded-lg flex items-center justify-center font-jua cursor-pointer gap-1', `<span style="${fs(.55)}">📢</span><span style="${fs(.32)}">교탁</span>`, 'background:#B08D5F;color:#fff;box-shadow:0 4px 0 #8E7350;', 'data-obj="podium"');
  const doneCount = isClass() ? Object.values(ROOM.students).filter(s => s.card.done).length : (D.card.done ? 1 : 0);
  h += box(15, 4, 4, 1, 'rounded-lg flex items-center justify-center font-jua cursor-pointer gap-1', `<span style="${fs(.5)}">🖼️</span><span style="${fs(.3)}">작품 게시판 (${doneCount})</span>`, 'background:#E3ECE4;color:#3B5E4A;border:calc(var(--t)*.07) solid #3B5E4A;', 'data-obj="gallery"');
  h += box(1, 4, 1, 1, 'flex items-center justify-center', '🪴', fs(.8));
  h += box(1, 13, 1, 2, 'rounded-md flex flex-col items-center justify-center', '📚<br>📚', 'background:#9C7B52;' + fs(.55));
  h += box(2, 6, 8, 1, 'flex items-center font-jua text-woodd', '🪑 학생 책상 영역 · 번호 순서대로 앉아요', fs(.32));
  // 자리 24개
  const me = myNum();
  for (let n = 1; n <= MAX_SEATS; n++){
    const s = seatPos(n), info = seatInfo(n);
    if (n === me){
      const nm = D.name ? esc(D.name) : '내 자리';
      h += box(s.x - 0.12, s.y, 1.24, 1, `rounded-md flex flex-col items-center justify-center cursor-pointer leading-none ${D.registered ? '' : 'glow'}`,
        `<span style="${fs(.42)}">${D.registered ? '📒' : '📝'}</span><span class="font-jua truncate max-w-full" style="${fs(.22)}">${n} ${nm}</span>`,
        `background:#FFFDF7;border:calc(var(--t)*.08) solid ${D.registered ? '#5E8A55' : '#3B5E4A'};z-index:2;`, 'data-obj="desk"');
      h += box(s.x - 0.5, s.y - 0.55, 2, 0.55, 'flex items-end justify-center', `<span class="font-jua bg-lavd text-white rounded-full px-1.5 whitespace-nowrap" style="${fs(.22)}">⭐ 내 자리</span>`);
    } else if (info){
      h += box(s.x - 0.12, s.y, 1.24, 1, 'rounded-md flex flex-col items-center justify-center cursor-pointer leading-none',

        'background:#FFFDF7;border:calc(var(--t)*.06) solid #B08D5F;', `data-obj="seat:${n}"`);

/* 이동 */
const DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
let lastBump = 0;
function tryMove(d){
  const [dx, dy] = DIRS[d]; P.dir = d;
  const nx = P.x + dx, ny = P.y + dy;
  if (BLOCK.has(keyOf(nx, ny))){
    const now = Date.now();
    if (now - lastBump > 1500 && ((stage < 2 && ny === 3 && nx >= 3 && nx <= 16) || (stage < 3 && nx === 14 && ny === 10))){ toast('🔒 선생님의 안내를 기다려 주세요!'); lastBump = now; }
    renderPlayer(); return false;
  }
  P.x = nx; P.y = ny; renderPlayer(); return true;
}

/* 길찾기(BFS) + 자동 걷기 */
let walkTimer = null;
function stopWalk(){ clearInterval(walkTimer); walkTimer = null; }
function findPath(goals){
  const goalSet = new Set(goals.filter(([x, y]) => !BLOCK.has(keyOf(x, y))).map(([x, y]) => keyOf(x, y)));
  if (!goalSet.size) return null;
  const start = keyOf(P.x, P.y); if (goalSet.has(start)) return [];
  const prev = new Map([[start, null]]), q = [[P.x, P.y]];
  while (q.length){
    const [x, y] = q.shift();
    for (const [d, [dx, dy]] of Object.entries(DIRS)){
      const nx = x + dx, ny = y + dy, k = keyOf(nx, ny);
      if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || BLOCK.has(k) || prev.has(k)) continue;
      prev.set(k, [keyOf(x, y), d]);
      if (goalSet.has(k)){ const path = []; let c = k; while (prev.get(c)){ const [p, dd] = prev.get(c); path.unshift(dd); c = p; } return path; }
      q.push([nx, ny]);
    }
  }
  return null;
}
function walk(path, onArrive){
  stopWalk();
  if (!path){ toast('🚧 그곳으로는 갈 수 없어요'); return; }
  if (!path.length){ onArrive && onArrive(); return; }
  walkTimer = setInterval(() => {
    const d = path.shift(); if (!d || !tryMove(d)){ stopWalk(); return; }
    if (!path.length){ clearInterval(walkTimer); walkTimer = null; onArrive && setTimeout(onArrive, 160); }
  }, 150);
}
function walkToInteract(key){
  const it = interactables().find(i => i.key === key); if (!it) return;
  walk(findPath(it.triggers), () => { const cur = currentInteract(); if (cur && cur.key === key) cur.act(); });
}
function walkToTile(x, y){
  if (!BLOCK.has(keyOf(x, y))) return walk(findPath([[x, y]]));
  walk(findPath([[x, y+1], [x, y-1], [x-1, y], [x+1, y]]));
}

/* 키보드: e.code를 써서 한글 입력 상태에서도 WASD가 작동 */
const KEYMAP = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right', KeyW:'up', KeyS:'down', KeyA:'left', KeyD:'right' };
const held = []; let moveLoop = null;
function pressDir(d){
  if (isTeacherView()) return;
  stopWalk();
  if (!held.includes(d)) held.push(d);
  if (!moveLoop){
    tryMove(d);
    moveLoop = setInterval(() => { if (!held.length){ clearInterval(moveLoop); moveLoop = null; return; } tryMove(held[held.length - 1]); }, 150);
  }
}
function releaseDir(d){ const i = held.indexOf(d); if (i >= 0) held.splice(i, 1); }
const typing = t => t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
document.addEventListener('keydown', e => {
  if (typing(e.target) || modalOpen() || !SESSION || !$('#entry').classList.contains('hidden')) return;
  const d = KEYMAP[e.code];
  if (d){ e.preventDefault(); if (!e.repeat) pressDir(d); return; }
  if (e.code === 'KeyF' || e.code === 'Space' || e.code === 'Enter'){
    if (e.target.tagName === 'BUTTON' && e.code !== 'KeyF') return;
    e.preventDefault(); if (!e.repeat) interactNow();
  }
});
document.addEventListener('keyup', e => { const d = KEYMAP[e.code]; if (d) releaseDir(d); });
window.addEventListener('blur', () => { held.length = 0; });
[].forEach(b => {
  const d = b.dataset.dir;
  b.addEventListener('pointerdown', e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch(_){} pressDir(d); });
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev => b.addEventListener(ev, () => releaseDir(d)));
  b.addEventListener('contextmenu', e => e.preventDefault());
});
$('#pBubble').addEventListener('click', e => { e.stopPropagation(); interactNow(); });

/* 스케치 캔버스 */
let sk = null;
function initSketch(){
  const c = $('#sketch'), ctx = c.getContext('2d');
  c.width = 960; c.height = 540;
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  sk = { c, ctx, color:'#2F3A33', eraser:false, drawing:false, dirty:false };
  if (D.card.sketch){ const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, c.width, c.height); img.src = D.card.sketch; }
  const pos = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
  c.onpointerdown = e => { e.preventDefault(); sk.drawing = true; try { c.setPointerCapture(e.pointerId); } catch(_){}
    const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + .1, y + .1); stroke(); sk.dirty = true; };
  c.onpointermove = e => { if (!sk.drawing) return; const [x, y] = pos(e); ctx.lineTo(x, y); stroke(); };
  const end = () => { if (!sk.drawing) return; sk.drawing = false; flushSketch(); };
  c.onpointerup = end; c.onpointercancel = end; c.onpointerleave = end;
  function stroke(){ ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = sk.eraser ? '#fff' : sk.color; ctx.lineWidth = sk.eraser ? 34 : 7; ctx.stroke(); }
  document.querySelectorAll('[data-pen]').forEach(b => b.onclick = () => {
    const v = b.dataset.pen; sk.eraser = v === 'eraser'; if (!sk.eraser) sk.color = v;
    document.querySelectorAll('[data-pen]').forEach(x => { if (x.dataset.pen !== 'eraser'){ x.classList.toggle('border-ink', x === b); x.classList.toggle('border-white', x !== b); } else x.classList.toggle('border-ink', sk.eraser); });
  });
  $('#clearSketch').onclick = () => { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); sk.dirty = false; D.card.sketch = ''; saveData(); };
}
function flushSketch(){
  if (!sk || !sk.dirty || !document.body.contains(sk.c)) return;
  D.card.sketch = sk.c.toDataURL('image/jpeg', 0.8); sk.dirty = false; saveData();
}

        ${[['🟢 접속', cnt.on], ['📒 문제 노트', cnt.note], ['📌 기법 북마크', cnt.bm], ['🃏 카드 완성', cnt.card]].map(([l, v]) => `<div class="rounded-2xl bg-line px-3 py-2"><div class="text-xs text-inksoft">${l}</div><div class="font-jua text-2xl">${v}<span class="text-sm text-inksoft">/${nums.length}명</span></div></div>`).join('')}
      </div>
      ${nums.length ? `<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-inksoft text-xs"><th class="text-left px-2">번호</th><th class="text-left px-2">이름</th><th class="px-2">접속</th><th class="px-2">1단계</th><th class="text-left px-2">2단계 기법</th><th class="px-2">3단계</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="text-center text-inksoft py-8">아직 입장한 학생이 없어요. 학생들에게 반 코드를 알려 주세요.</div>'}
    </div>`;
  if (modalName === 'dash'){ const sc = $('#modalBox').scrollTop; $('#modalBox').innerHTML = html; $('#modalBox').scrollTop = sc; }
  else openModal(html, null, 'dash');
  document.querySelectorAll('[data-dash]').forEach(b => b.onclick = () => openFriend(+b.dataset.dash));
}

/* =========================================================
   🔑 단계 열쇠 코드 (비상용 · 혼자 하기)
   ========================================================= */
function openLocked(n){
  openModal(`${modalHead(`🔒 ${n}단계에 열려요`, '')}
    <div class="p-6 text-center space-y-4">
      <div class="font-jua text-2xl break-keep">선생님의 안내를 기다려 주세요!</div>
      <button id="toCode" class="text-sm font-jua px-4 py-2 rounded-full bg-line text-inksoft">🔑 선생님이 코드를 알려 줬어요 · 코드 입력</button>
    </div>`);
  $('#toCode').onclick = () => openCodeModal(n);
}
function openCodeModal(n){
  openModal(`${modalHead('🔑 선생님 코드 입력', `${n}단계를 여는 코드예요. 선생님이 알려 줄 때만 입력해요.`, 'text-lavd')}
    <form id="codeForm" class="p-5 space-y-3">
      <input name="code" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="코드 4자리" class="w-full text-center tracking-[.4em] font-jua text-3xl px-4 py-3 rounded-2xl border-2 border-line bg-white focus:outline-none focus:border-lavd">
      <button class="w-full py-3.5 rounded-2xl bg-lavd text-white font-jua text-lg">열기</button>
    </form>`);
  const f = $('#codeForm'); setTimeout(() => f.elements.code.focus(), 50);
  f.onsubmit = e => {
    e.preventDefault();
    if (f.elements.code.value.trim() === UNLOCK_CODES[n]){ closeModal(); setStage(Math.max(stage, n), { remote: true }); }
    else { f.elements.code.value = ''; f.classList.remove('wiggle'); void f.offsetWidth; f.classList.add('wiggle'); toast('🙅 코드가 맞지 않아요'); }
  };
}

/* =========================================================
   👑 교사 컨트롤러
   ========================================================= */
function renderTeacher(){
  $('#teacherPanel').classList.toggle('hidden', !panelOpen || (isClass() && !isTeacherView()));
  $('#teacherToggleArrow').textContent = panelOpen ? '▴' : '▾';
  const body = $('#teacherBody');
  if (!teacherAuthed && !isTeacherView()){
    body.innerHTML = `<form id="pinForm" class="flex flex-wrap items-center gap-2">
      <span class="font-jua text-lg">👑 교사 모드</span>
      <span class="text-sm text-inksoft">비밀번호를 입력하면 단계를 조율할 수 있어요.</span>
      <input name="pin" type="password" inputmode="numeric" maxlength="12" placeholder="비밀번호" class="w-36 px-4 py-2.5 rounded-full border-2 border-lemond bg-white font-jua tracking-widest focus:outline-none">
      <button class="px-4 py-2.5 rounded-full bg-ink text-white font-jua">교사 모드 켜기</button></form>`;
    $('#pinForm').onsubmit = e => {
      e.preventDefault();
      if (e.target.elements.pin.value === (store.get(K.pin, null) || DEFAULT_PIN)){ teacherAuthed = true; sessionStorage.setItem(K.auth, '1'); renderTeacher(); toast('👑 교사 모드가 켜졌어요'); }
      else { e.target.elements.pin.value = ''; toast('🙅 비밀번호가 맞지 않아요'); }
    };
    return;
  }
  const tv = isTeacherView();
  const btns = [1,2,3].map(n => {
    const cur = n === stage, open = n < stage;
    const cls = cur ? 'bg-lavd text-white border-lavd shadow-lg scale-[1.02]' : open ? 'bg-mint text-mintd border-mintd' : 'bg-paper text-ink border-line';
    const tag = cur ? '▶ 진행 중' : open ? '✅ 열림' : '🔒 잠김';
    return `${n>1?'<span class="hidden sm:flex items-center text-2xl text-lemond font-jua">➔</span>':''}
      <button data-stage="${n}" class="flex-1 min-w-[150px] text-left rounded-2xl border-[3px] ${cls} px-4 py-3 transition active:scale-[.98]">
        <div class="text-xs font-bold opacity-80">${tag}</div><div class="font-jua text-base sm:text-lg leading-tight">${STAGES[n].btn}</div>
        <div class="text-xs opacity-80 mt-0.5">${STAGES[n].place}</div></button>`;
  }).join('');
  body.innerHTML = `
    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
      <div class="font-jua text-lg">👑 교사 컨트롤러 <span class="text-sm text-inksoft">· ${tv ? '버튼을 누르면 <b>반 학생 모두의 화면</b>이 함께 바뀌어요' : '버튼을 누르면 해당 단계까지 열리고 안내가 바뀌어요'}</span></div>
      ${tv ? `<div class="font-jua text-lg px-4 py-1.5 rounded-full bg-paper border-2 border-lemond">🏷️ 반 코드 <span class="text-2xl text-lavd tracking-wider">${esc(SESSION.room)}</span></div>`
           : '<button id="tLock" class="text-sm font-jua px-3 py-1.5 rounded-full bg-paper border-2 border-lemond">🔐 교사 모드 잠그기</button>'}
    </div>
    <div class="flex flex-col sm:flex-row gap-2">${btns}</div>
    ${tv ? `<div class="flex flex-wrap gap-2 mt-3">
      <button id="tDash" class="font-jua px-4 py-2.5 rounded-full bg-sky text-skyd border-2 border-skyd">📊 진행 현황판</button>
      <button id="tGal" class="font-jua px-4 py-2.5 rounded-full bg-lav text-lavd border-2 border-lavd">🖼️ 작품 게시판</button>
      <button id="tFriends" class="font-jua px-4 py-2.5 rounded-full border-2 ${ROOM.showFriends ? 'bg-mint text-mintd border-mintd' : 'bg-line text-inksoft border-line'}">👥 학생 화면의 친구 캐릭터: ${ROOM.showFriends ? '보이기 ON' : '숨김 OFF'}</button>
      <span data-conn class="font-jua px-3 py-2.5 text-sm">${connText()}</span></div>` : ''}
    <div class="grid lg:grid-cols-[1.5fr_1fr] gap-3 mt-4">
      <div class="rounded-2xl bg-paper border-2 border-lemond p-3">
        <div class="font-jua mb-1">📢 ${stage}단계 선생님 안내 편집 <span class="text-xs text-inksoft">(상단 배너에 표시)</span></div>
        <textarea id="qEdit" rows="2" class="w-full px-3 py-2 rounded-xl border-2 border-line bg-white text-sm focus:outline-none">${esc(Q[stage])}</textarea>
        <div class="flex gap-2 justify-end mt-1">
          <button id="qReset" class="text-sm font-jua px-3 py-1.5 rounded-full bg-line">기본 안내</button>
          <button id="qSave" class="text-sm font-jua px-3 py-1.5 rounded-full bg-lavd text-white">안내 적용</button></div>
      </div>
      <div class="rounded-2xl bg-paper border-2 border-lemond p-3 text-sm">
        <div class="font-jua mb-1">🔑 ${tv ? '비상용 ' : ''}잠금 해제 코드</div>
        <div class="flex gap-2 my-1">
          <span class="flex-1 text-center rounded-xl bg-sky px-2 py-1.5"><span class="text-xs">2단계</span><br><b class="font-jua text-xl tracking-widest">${UNLOCK_CODES[2]}</b></span>
          <span class="flex-1 text-center rounded-xl bg-peach px-2 py-1.5"><span class="text-xs">3단계</span><br><b class="font-jua text-xl tracking-widest">${UNLOCK_CODES[3]}</b></span></div>
        <p class="text-xs text-inksoft break-keep">${tv ? '인터넷이 끊긴 학생이 있을 때 알려 주세요. 학생이 잠긴 공간을 누르고 「🔑 코드 입력」에 넣어요.' : '단계를 열 시점에 코드를 알려 주면, 학생이 잠긴 공간을 누르고 「🔑 코드 입력」에 넣어요.'}</p>
        <div class="flex flex-wrap gap-2 mt-2">
          ${tv ? '<button id="wipeRoom" class="text-xs font-jua px-3 py-1.5 rounded-full bg-pinkp text-pinkd">🧹 이 반 기록 전체 삭제 (서버)</button>'
               : '<button id="pinChange" class="text-xs font-jua px-3 py-1.5 rounded-full bg-line">비밀번호 바꾸기</button><button id="resetData" class="text-xs font-jua px-3 py-1.5 rounded-full bg-pinkp text-pinkd">이 기기 학생 기록 초기화</button>'}
        </div>
      </div>
    </div>`;
  body.querySelectorAll('[data-stage]').forEach(b => b.onclick = () => setStage(parseInt(b.dataset.stage, 10)));
  $('#qSave').onclick = () => { Q[stage] = $('#qEdit').value.trim() || DEFAULT_Q[stage]; saveQ(); renderBanner(); toast('📢 선생님 안내를 바꿨어요'); };
  $('#qReset').onclick = () => { Q[stage] = DEFAULT_Q[stage]; saveQ(); renderAll(); toast('📢 기본 안내로 되돌렸어요'); };
  if (tv){
    $('#tDash').onclick = openDashboard; $('#tGal').onclick = openGallery;
    $('#tFriends').onclick = () => { ROOM.showFriends = !ROOM.showFriends; Net.api.set(Net.p('showFriends'), ROOM.showFriends).catch(() => {}); renderTeacher();
      toast(ROOM.showFriends ? '👥 학생 화면에 친구 캐릭터가 보여요' : '🙈 학생 화면에서 친구 캐릭터를 숨겼어요'); };
    $('#wipeRoom').onclick = () => confirmBox(`<b>「${esc(SESSION.room)}」</b> 반의 모든 기록(학생 이름·노트·카드·그림)을 서버에서 지울까요? 되돌릴 수 없어요.<br><span class="text-sm text-inksoft">학생 기기에 남은 기록은 각 기기에서 지워야 해요.</span>`, '모두 지우기', () => {
      Net.api.remove(`rooms/${SESSION.room}`).catch(() => {});
      toast('🧹 서버에서 이 반 기록을 지웠어요'); Net.stop(); SESSION = null; store.del(K.session); showEntry();
    });
  } else {
    $('#tLock').onclick = () => { teacherAuthed = false; sessionStorage.removeItem(K.auth); renderTeacher(); toast('🔐 교사 모드를 잠갔어요'); };
    $('#pinChange').onclick = () => {
      openModal(`${modalHead('🔐 교사 비밀번호 바꾸기', '이 기기에서만 바뀌어요.')}
        <form id="pinNew" class="p-5 space-y-3"><input name="p" type="password" inputmode="numeric" maxlength="12" placeholder="새 비밀번호 (4자리 이상)" class="w-full px-4 py-3 rounded-2xl border-2 border-line bg-white font-jua tracking-widest">
        <button class="w-full py-3 rounded-2xl bg-ink text-white font-jua">저장</button></form>`);
      $('#pinNew').onsubmit = e => { e.preventDefault(); const v = e.target.elements.p.value.trim(); if (v.length < 4){ toast('4자리 이상 입력해 주세요'); return; } store.set(K.pin, v); closeModal(); toast('🔐 비밀번호를 바꿨어요'); };
    };
    $('#resetData').onclick = () => confirmBox('이 기기에 저장된 <b>학생 이름·문제 노트·북마크·구상 카드</b>를 모두 지울까요? 되돌릴 수 없어요.', '모두 지우기', () => {
      D = defaultData(); store.set(dataKey(), D); P.x = START.x; P.y = START.y; renderAll(); toast('🧹 학생 기록을 초기화했어요');
    });
  }
}
function saveQ(){
  if (isTeacherView() && Net.api) Net.api.set(Net.p('questions'), Q).catch(() => {});
  else store.set(K.soloQ, Q);
}
$('#teacherToggle').onclick = () => { panelOpen = !panelOpen; store.set(K.panel, panelOpen); renderTeacher(); };

/* 같은 브라우저의 다른 탭과 동기화 (혼자 하기) */
window.addEventListener('storage', e => {
  if (isClass() || !SESSION) return;
  if (e.key === K.soloStage) setStage(store.get(K.soloStage, 1), { remote:true });
  else if (e.key === K.soloQ){ Q = Object.assign({}, DEFAULT_Q, store.get(K.soloQ, {})); renderBanner(); }
});
window.addEventListener('pagehide', () => { if (isClass()) Net.leave(); });
window.addEventListener('pageshow', e => { if (e.persisted && isClass()) Net.start(); });
function connText(){ return `${ROOM.online ? '<span class="text-mintd">🟢 서버 연결됨</span>' : '<span class="text-peachd">🟠 연결 끊김 · 다시 연결 중</span>'} · 접속 ${Object.keys(ROOM.presence || {}).length}명`; }

/* ---------- 시작 ---------- */
if (!SESSION || (isClass() && !classAvailable())){ SESSION = null; showEntry(); }
else startSession(SESSION);
</script>
</body>
</html>
